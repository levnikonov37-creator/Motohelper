<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MotoHelper — справочник китайских эндуро</title>
<meta name="description" content="Диагностика, ремонт, тюнинг и запчасти для китайских эндуро, питбайков и мопедов." />
<meta name="theme-color" content="#1B1F23" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8D%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700&family=Fira+Sans:wght@400;500;600&family=Russo+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
:root {
  --bg: #E3E5E0; --surface: #F7F7F4; --surface2: #ECEEE9; --ink: #1B1F22; --muted: #5A6268; --line: #C7CBC4;
  --plate: #F3C318; --plate-ink: #1B1F22; --mud: #7A5C3E; --danger: #B8352B; --warn: #A86A12; --ok: #2F7A4D; --focus: #1F5FBF;
  --stage: #1B1F23; --stage2: #262C32; --stage-ink: #EEF0EC; --stage-muted: #9AA3AA;
  --display: "Russo One", "Arial Black", Impact, sans-serif;
  --body: "Fira Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --cond: "Fira Sans Condensed", "Arial Narrow", "Fira Sans", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #202428; --surface: #2A2F34; --surface2: #33393F; --ink: #ECEEEA; --muted: #A0A8AE; --line: #424950; --mud: #C9A27A; --danger: #EF7A6F; --warn: #E8AA4C; --ok: #72C793; --focus: #8CB8FF; --stage: #15181B; --stage2: #1F2428; }
}
:root[data-theme="dark"] { --bg: #202428; --surface: #2A2F34; --surface2: #33393F; --ink: #ECEEEA; --muted: #A0A8AE; --line: #424950; --mud: #C9A27A; --danger: #EF7A6F; --warn: #E8AA4C; --ok: #72C793; --focus: #8CB8FF; --stage: #15181B; --stage2: #1F2428; }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1 { font: 400 clamp(28px, 4.6vw, 42px)/1.08 var(--display); margin: 6px 0 12px; }
h2 { font: 400 22px/1.2 var(--display); margin: 34px 0 12px; }
h3 { font: 600 16px/1.3 var(--body); margin: 0 0 8px; }
h4 { font: 600 15px/1.3 var(--body); margin: 14px 0 6px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.price { font-family: var(--cond); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ico { vertical-align: middle; flex: none; }
code { font-family: var(--cond); background: var(--surface2); padding: 1px 5px; border-radius: 4px; }

/* ---------- каркас ---------- */
.rail { display: none; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--stage); color: var(--stage-ink); }
.brand { display: flex; align-items: center; gap: 10px; font: 400 18px var(--display); color: inherit; text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 28px; background: var(--plate); color: var(--plate-ink); border-radius: 7px; font-size: 14px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.bike-chip { display: inline-flex; gap: 8px; align-items: center; max-width: 62vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--stage2) !important; border-color: #3B434B !important; color: var(--stage-ink) !important; }
.bc-code { font: 400 12px var(--display); color: var(--plate); }
.main { max-width: 1060px; margin: 0 auto; padding: 16px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--stage); color: var(--stage-muted); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 24px -12px rgba(0,0,0,.5); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; background: none; border: 0; font-size: 11px; color: inherit; }
.tab.on { color: var(--stage-ink); font-weight: 600; }
.tab.on .tab-ico { color: var(--plate); }
.tab-ai .tab-ico { display: grid; place-items: center; width: 50px; height: 50px; margin-top: -24px; border-radius: 50%; background: var(--plate); color: var(--plate-ink) !important; box-shadow: 0 6px 16px -6px rgba(243,195,24,.8), 0 0 0 4px var(--stage); }
.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); max-width: 72ch; }

@media (min-width: 980px) {
  .shell { display: grid; grid-template-columns: 252px 1fr; grid-template-rows: auto 1fr; }
  .rail { grid-row: 1 / span 2; align-self: start; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; background: var(--stage); color: var(--stage-ink); overflow-y: auto; }
  .rail .brand { padding: 0 8px; }
  .rail-nav { display: flex; flex-direction: column; gap: 2px; }
  .rail-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: none; border-radius: 10px; text-align: left; color: var(--stage-muted); font-weight: 500; }
  .rail-item:hover { color: var(--stage-ink); background: var(--stage2); }
  .rail-item.on { color: var(--stage-ink); background: var(--stage2); box-shadow: inset 4px 0 0 var(--plate); }
  .rail-item.ai { color: var(--plate); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: #6CC08D; margin-left: auto; box-shadow: 0 0 0 3px rgba(108,192,141,.2); }
  .rail-bike { margin-top: auto; display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid #3A424A; background: linear-gradient(160deg, #2B3238, #1F2428); color: var(--stage-ink); }
  .rb-code { font: 400 20px var(--display); color: var(--plate); }
  .rb-name { font-size: 14px; }
  .rb-mod { font: 600 12px var(--cond); color: var(--stage-muted); }
  .rail-links { display: flex; flex-direction: column; gap: 2px; padding: 0 6px; }
  .rail-links .link { color: var(--stage-muted); font-size: 13px; padding: 3px 0; text-align: left; }
  .topbar { display: none; }
  .main { grid-column: 2; grid-row: 1 / span 2; padding: 28px 40px 64px; width: 100%; }
  .tabbar { display: none; }
}

/* ---------- кнопки и поля ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; text-align: center; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { background: var(--mud); border-color: var(--mud); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger:hover { background: var(--danger); color: var(--bg); }
.btn.ai-btn { background: var(--plate); color: var(--plate-ink); border-color: var(--plate-ink); margin-top: 10px; }
.btn.ai-btn:hover { filter: brightness(1.05); }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; flex: none; }
.link { background: none; border: 0; padding: 8px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.link.inline { padding: 0; font-size: inherit; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--plate); color: var(--plate-ink); border-color: var(--plate-ink); }
.chip.static { cursor: default; background: var(--surface2); }
.chip.static:hover { border-color: var(--line); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.tags.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.row-gap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg.wrap { flex-wrap: wrap; display: flex; }
.seg button { padding: 8px 14px; border: 0; background: none; border-right: 1px solid var(--line); font-weight: 500; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--plate); color: var(--plate-ink); font-weight: 600; }
.seg small { font-family: var(--cond); opacity: .7; margin-left: 4px; }
.seg.sm button { padding: 5px 12px; font-size: 14px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; }
.check input { width: 18px; height: 18px; accent-color: var(--mud); }
.sel { display: inline-flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); }
select, input[type="text"], input[type="search"], input[type="number"], input:not([type]), textarea { min-height: 42px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); width: 100%; }
textarea { resize: vertical; }
.sel select { width: auto; }
.empty { color: var(--muted); padding: 16px 0; list-style: none; }
.callout { padding: 12px 14px; border-radius: 10px; border-left: 5px solid var(--danger); background: var(--surface); margin: 14px 0; }
.callout.info { border-left-color: var(--plate); }
.callout.warn { border-left-color: var(--warn); margin: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.panel h2 { margin: 0 0 10px; font-size: 19px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
.page-head h1 { margin-bottom: 0; }

/* ---------- сцена с двигателем ---------- */
.explorer { margin: 8px 0 16px; }
.stage { position: relative; border-radius: 22px; overflow: hidden; color: var(--stage-ink);
  background: radial-gradient(ellipse 70% 60% at 50% 46%, #3B434B 0%, #23282D 55%, #16191C 100%);
  box-shadow: 0 20px 40px -24px rgba(0,0,0,.6); }
.stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 28px 28px; }
.stage::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: repeating-linear-gradient(-45deg, var(--plate) 0 14px, #1B1F22 14px 28px); opacity: .9; }
.stage-top { position: relative; z-index: 1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 24px; padding: 22px 22px 0; }
.stage-code { font: 400 clamp(30px, 6vw, 52px)/1 var(--display); color: var(--plate); letter-spacing: .01em; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.stage-bike { margin-top: 6px; font-weight: 600; color: var(--stage-ink); }
.stage-stats { display: flex; gap: 22px; margin: 0; }
.stage-stats dt { font: 500 12px var(--cond); color: var(--stage-muted); }
.stage-stats dd { margin: 0; font: 400 26px/1.1 var(--display); }
.stage-stats dd small { font: 600 13px var(--cond); color: var(--stage-muted); }
.stage-stats dd.sm { font: 600 16px/1.6 var(--cond); max-width: 150px; }
.engine-svg { position: relative; z-index: 1; display: block; width: 100%; max-width: 820px; margin: -6px auto 0; height: auto; }
.stage-chips { position: relative; z-index: 1; display: flex; gap: 6px; overflow-x: auto; padding: 0 18px 18px; scrollbar-width: none; }
.stage-chips::-webkit-scrollbar { display: none; }
.schip { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid #434B53; background: rgba(255,255,255,.04); color: var(--stage-ink); font-size: 13px; font-weight: 500; }
.schip:hover { border-color: var(--plate); }
.schip.on { background: var(--plate); color: var(--plate-ink); border-color: var(--plate); }
.stage-hint { margin: 10px 4px 0; font-size: 14px; color: var(--muted); }
.eng-stamp { font: 400 13px var(--display); fill: #6E767D; letter-spacing: .08em; }
.eng-stamp-hi { font: 400 13px var(--display); fill: rgba(255,255,255,.55); letter-spacing: .08em; transform: translate(.6px, .8px); mix-blend-mode: soft-light; }
.eng-tiny { font: 600 9px var(--cond); fill: #5E666E; letter-spacing: .2em; }
.pa { cursor: pointer; transition: filter .2s; }
.pa:hover { filter: brightness(1.08); }
.pa.on { filter: drop-shadow(0 0 1.5px #F3C318) drop-shadow(0 0 10px rgba(243,195,24,.85)); }
.pin { cursor: pointer; outline: none; }
.pin-hit { fill: transparent; }
.pin-dot { fill: #F3C318; stroke: #15181B; stroke-width: 2.5; transition: transform .15s; }
.pin-core { fill: #15181B; }
.pin-pulse { fill: none; stroke: #F3C318; stroke-width: 2; opacity: 0; transform-origin: 0 0; animation: pulse 1.8s ease-out 0.4s 3; }
.pin:hover .pin-dot, .pin:focus-visible .pin-dot, .pin.on .pin-dot { transform: scale(1.18); }
.pin.on .pin-dot { fill: #FFFFFF; }
.pin:focus-visible .pin-dot { stroke: #8CB8FF; stroke-width: 3; }
@keyframes pulse { 0% { opacity: .9; transform: scale(.9); } 100% { opacity: 0; transform: scale(2.2); } }
@media (max-width: 600px) { .pin-dot { r: 14; } .pin-core { r: 5; } .stage-top { padding: 20px 16px 0; } .stage-stats { gap: 14px; } .stage-stats dd { font-size: 20px; } }

.area { position: relative; margin-top: -14px; padding: 26px 18px 18px; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--plate); border-radius: 0 0 18px 18px; }
.area-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.area-head h2 { margin: 0; }
.area-grid { display: grid; gap: 18px; margin-top: 10px; }
@media (min-width: 820px) { .area-grid { grid-template-columns: 1fr 1fr; } }
.area h3 { margin-top: 14px; }
.kv { width: 100%; border-collapse: collapse; }
.kv th { text-align: left; font-weight: 400; color: var(--muted); padding: 6px 8px 6px 0; }
.kv td { text-align: right; font: 600 16px var(--cond); padding: 6px 0; }
.kv tr + tr { border-top: 1px dashed var(--line); }
.pl-r { display: inline-flex; align-items: center; gap: 8px; }
.mini { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface2); }
.mini.in { background: var(--plate); color: var(--plate-ink); border-color: var(--plate-ink); }

/* ---------- главная ---------- */
.home-top { margin-bottom: 14px; }
.home-title { max-width: 18ch; }
.qsearch { display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 14px; background: var(--surface); min-height: 52px; max-width: 720px; }
.qsearch input { border: 0 !important; background: transparent !important; padding: 12px 0 !important; min-height: 0 !important; outline: none; flex: 1; font-size: 16px; }
.qsearch:focus-within { box-shadow: 0 0 0 4px rgba(243,195,24,.6); }
.qsearch .ico { color: var(--muted); }
.qsearch.grow { flex: 1 1 280px; min-height: 46px; border-width: 1.5px; border-color: var(--line); margin: 12px 0; }
.sheet .qsearch { border-width: 1.5px; min-height: 46px; }
.qresults { list-style: none; margin: 8px 0 0; padding: 4px; max-width: 720px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 24px -16px rgba(0,0,0,.4); }
.qresults button { display: grid; grid-template-columns: 104px 1fr auto; gap: 10px; align-items: center; width: 100%; padding: 10px; border: 0; background: none; text-align: left; border-radius: 9px; }
.qresults button:hover { background: var(--surface2); }
.qr-type { font: 600 12px var(--cond); color: var(--mud); }
.qempty { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.actions3 { display: grid; gap: 10px; margin: 18px 0; }
@media (min-width: 700px) { .actions3 { grid-template-columns: 1.3fr 1fr 1fr; } }
.act { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; gap: 0 12px; align-items: center; text-align: left; padding: 16px 18px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); }
.act .ico { grid-row: 1 / span 2; }
.act b { font: 400 19px var(--display); }
.act span { font-size: 14px; color: var(--muted); }
.act:hover { border-color: var(--ink); }
.act-ai { background: var(--plate); color: var(--plate-ink); border-color: var(--plate-ink); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
.act-ai span { color: rgba(27,31,34,.75); }
.home-grid { display: grid; gap: 12px; margin-top: 8px; }
@media (min-width: 760px) { .home-grid { grid-template-columns: 1fr 1fr; } }

/* ---------- мой мотоцикл ---------- */
.tabs { display: flex; gap: 4px; margin: 20px 0 12px; border-bottom: 2px solid var(--line); overflow-x: auto; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); background: var(--bg); z-index: 10; scrollbar-width: none; }
@media (min-width: 980px) { .tabs { top: 0; } }
.tabs button { padding: 12px 16px; border: 0; background: none; font-weight: 600; color: var(--muted); border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--plate); }
.dot { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--plate); color: var(--plate-ink); font: 700 12px var(--cond); }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0; margin: 0; border-top: 1px solid var(--line); }
.specs div { padding: 10px 4px; border-bottom: 1px solid var(--line); }
.specs dt { font-size: 13px; color: var(--muted); }
.specs dd { margin: 2px 0 0; font: 600 17px var(--cond); }
.adj, .refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.adj-block { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.adj-block table, .to-table { width: 100%; border-collapse: collapse; }
.adj-block th, .to-table th { text-align: left; font-weight: 400; color: var(--muted); padding: 6px 8px 6px 0; vertical-align: top; }
.adj-block td, .to-table td { text-align: right; font: 600 16px var(--cond); padding: 6px 0; font-variant-numeric: tabular-nums; }
.adj-block tr + tr, .to-table tr + tr { border-top: 1px dashed var(--line); }
.to-table { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.to-table th { padding-left: 14px; color: var(--ink); } .to-table td { padding-right: 14px; color: var(--mud); }
.val.changed { display: inline-flex; flex-direction: column; align-items: flex-end; background: linear-gradient(transparent 58%, rgba(243,195,24,.55) 58%); }
.specs .val.changed { align-items: flex-start; }
.val small { font: 500 12px var(--cond); color: var(--muted); text-decoration: line-through; }
.notes { white-space: pre-wrap; background: var(--surface); padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); max-width: 70ch; }
.issues { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.issues li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 12px; border-left: 5px solid var(--line); }
.issues.compact li { grid-template-columns: 1fr; padding: 8px 12px; background: var(--surface2); }
.issues p { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.sev { font: 600 14px var(--cond); }
.sev-high { border-left-color: var(--danger) !important; } .sev-high .sev { color: var(--danger); }
.sev-med { border-left-color: var(--warn) !important; } .sev-med .sev { color: var(--warn); }
.sev-low .sev { color: var(--muted); }

/* форма */
.edit fieldset { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 16px; margin: 0 0 16px; background: var(--surface); }
.edit legend { font: 400 18px var(--display); padding: 0 8px; margin-left: -8px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.fgrid .wide { grid-column: 1 / -1; }
.f { display: flex; flex-direction: column; gap: 6px; }
.f.narrow { max-width: 420px; }
.f-label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; min-height: 22px; }
.f-reset { display: inline-flex; align-items: center; gap: 3px; border: 0; background: none; color: var(--mud); font: 600 13px var(--cond); padding: 0; }
.f-hint { font-size: 13px; color: var(--muted); }
.f input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
.f-changed input, .f-changed select { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--plate); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checkchip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface2); font-size: 14px; font-weight: 500; text-align: left; }
.checkchip small { font: 600 12px var(--cond); color: var(--mud); }
.checkchip.on { background: var(--plate); color: var(--plate-ink); border-color: var(--plate-ink); }
.checkchip.on small { color: var(--plate-ink); }

/* ТО */
.odo { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 8px 0; }
.odo .f { width: 220px; }
.odo input { font: 400 22px var(--display); }
.mlist { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 10px; }
@media (min-width: 760px) { .mlist:not(.compact) { grid-template-columns: 1fr 1fr; } }
.mlist li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.mlist.compact li { background: none; border: 0; padding: 6px 0; border-radius: 0; }
.m-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.m-left { font: 600 14px var(--cond); color: var(--muted); text-align: right; }
.m-bar { height: 8px; background: var(--surface2); border-radius: 4px; margin: 8px 0; overflow: hidden; }
.m-bar span { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
.m-soon .m-bar span { background: var(--warn); } .m-soon .m-left { color: var(--warn); }
.m-due .m-bar span { background: var(--danger); } .m-due .m-left { color: var(--danger); }
.m-none .m-bar span { width: 0 !important; }
.m-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

/* ---------- диагностика ---------- */
.ai-banner { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 720px; text-align: left; padding: 14px 16px; margin: 6px 0 16px; border-radius: 14px; border: 1.5px dashed var(--mud); background: var(--surface); }
.ai-banner .ico { color: var(--mud); }
.symptoms { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 8px; margin-top: 12px; }
.symptom { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; font-weight: 500; }
.symptom:hover { border-color: var(--ink); }
.sy-i { font-size: 20px; }
.wizard { margin-top: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px 18px 18px; max-width: 700px; }
.wz-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 17px; }
.wz-steps { display: flex; gap: 6px; list-style: none; padding: 0; margin: 14px 0; }
.wz-steps li { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.wz-steps li.done { background: var(--mud); } .wz-steps li.cur { background: var(--plate); }
.wz-q { font-size: 20px; font-weight: 600; line-height: 1.35; margin: 4px 0 8px; }
.wz-hint { color: var(--muted); font-size: 15px; }
.wz-yn { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
.wz-yn .btn { flex: 1 1 140px; }
.wz-opts { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 4px; }
.wz-opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface2); font-weight: 500; }
.wz-opt:hover { border-color: var(--ink); }
.wz-res h3 { font: 400 24px/1.2 var(--display); margin: 12px 0 8px; }
.plist { list-style: none; padding: 0; margin: 6px 0 12px; }
.plist li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }

/* ---------- ремонт ---------- */
.guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.guide { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); }
.guide:hover { border-color: var(--ink); }
.guide b { font-size: 17px; line-height: 1.3; }
.g-area { font: 600 12px var(--cond); color: var(--mud); }
.g-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 13px var(--cond); color: var(--muted); }
.g-steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.g-steps li { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.g-steps li p { margin: 6px 0 0; }
.g-steps li.done { opacity: .6; }
.g-steps li.done p { text-decoration: line-through; text-decoration-color: var(--muted); }
.g-check { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); font: 400 15px var(--display); display: grid; place-items: center; }
.g-steps li.done .g-check { background: var(--plate); border-color: var(--plate-ink); color: var(--plate-ink); }
.faults { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
@media (min-width: 760px) { .faults { grid-template-columns: 1fr 1fr; } }
.faults > li { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.faults ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted); }
.faults ol li { margin-bottom: 2px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.codes { width: 100%; border-collapse: collapse; min-width: 560px; }
.codes th, .codes td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.codes th { font: 600 13px var(--cond); color: var(--muted); }
.codes td.code { font: 400 15px var(--display); color: var(--mud); white-space: nowrap; }

/* ---------- ИИ ---------- */
.ai-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 18px 20px; border-radius: 20px; color: var(--stage-ink); background: radial-gradient(ellipse at 15% 0%, #3E474F 0%, #1B1F23 70%); position: relative; overflow: hidden; }
.ai-head::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: repeating-linear-gradient(-45deg, var(--plate) 0 14px, #1B1F22 14px 28px); }
.ai-title { display: flex; gap: 14px; align-items: center; }
.ai-title h1 { margin: 0; }
.ai-title p { margin: 4px 0 0; color: var(--stage-muted); font-size: 14px; max-width: 60ch; }
.ai-logo { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--plate); color: var(--plate-ink); flex: none; }
.ai-tools { display: flex; gap: 8px; align-items: center; }
.ai-tools .seg { background: rgba(255,255,255,.06); border-color: #444C54; }
.ai-tools .seg button { color: var(--stage-ink); border-color: #444C54; }
.ai-tools .seg button.on { color: var(--plate-ink); }
.ai-tools .btn.ghost { color: var(--stage-ink); border-color: #444C54; }
.ai-off { margin-top: 14px; }
.chat { display: flex; flex-direction: column; gap: 12px; padding: 16px 2px; min-height: 240px; max-height: calc(100vh - 360px); overflow-y: auto; }
@media (max-width: 979px) { .chat { max-height: none; } }
.chat-empty { max-width: 640px; }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sugg .chip { white-space: normal; text-align: left; }
.msg { display: flex; }
.msg.user { justify-content: flex-end; }
.msg .bubble { max-width: min(680px, 88%); padding: 10px 14px; border-radius: 16px; line-height: 1.5; }
.msg.user .bubble { background: var(--ink); color: var(--bg); border-bottom-right-radius: 6px; white-space: pre-wrap; }
.msg.assistant .bubble { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--plate); border-bottom-left-radius: 6px; }
.msg-photo { display: inline-flex; gap: 4px; align-items: center; font: 600 12px var(--cond); background: rgba(255,255,255,.15); padding: 2px 8px; border-radius: 999px; margin-right: 8px; }
.md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; }
.md li { margin-bottom: 4px; }
.md h4 { margin: 10px 0 4px; }
.part-tag { display: inline-flex; align-items: center; gap: 3px; margin: 0 2px; padding: 1px 8px; border-radius: 999px; border: 1.5px solid var(--plate-ink); background: var(--plate); color: var(--plate-ink); font: 600 12px var(--cond); vertical-align: 1px; }
.part-tag.in { background: var(--surface2); color: var(--ink); border-color: var(--line); }
.thinking { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--mud); animation: blink 1.2s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; margin-right: 6px; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.chat-err { padding: 10px 14px; border-radius: 12px; background: var(--surface); border-left: 4px solid var(--danger); }
.composer { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--bg); padding: 8px 0 4px; }
@media (min-width: 980px) { .composer { bottom: 0; } }
.comp-row { display: flex; gap: 8px; align-items: flex-end; padding: 8px; border: 2px solid var(--ink); border-radius: 18px; background: var(--surface); }
.comp-row:focus-within { box-shadow: 0 0 0 4px rgba(243,195,24,.55); }
.comp-row textarea { border: 0; background: transparent; min-height: 40px; max-height: 160px; padding: 9px 6px; outline: none; field-sizing: content; }
.comp-row .icon-btn { border: 0; background: var(--surface2); }
.send { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; border: 0; background: var(--plate); color: var(--plate-ink); flex: none; }
.send:disabled { opacity: .45; cursor: default; }
.send.stop { background: var(--ink); color: var(--bg); }
.photo-chip { display: inline-flex; gap: 8px; align-items: center; margin: 0 0 8px; padding: 4px 4px 4px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.photo-chip .link { padding: 2px 8px; }
.ai-note { margin: 6px 4px 0; font-size: 12px; color: var(--muted); }

/* ---------- тюнинг ---------- */
.toolbar { margin: 14px 0; }
.tlist { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.tcard { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 16px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.tcard.in { border-color: var(--ink); box-shadow: inset 5px 0 0 var(--plate); }
.tcard.must { border-style: dashed; border-color: var(--mud); }
.tcard.no { opacity: .62; }
.tcard.owned { background: var(--surface2); }
.tc-top { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.tc-top span:first-child { font-weight: 600; color: var(--mud); }
.tc-stage { font-family: var(--cond); font-weight: 600; }
.tc-must { color: var(--mud); font-weight: 600; }
.tcard h3 { margin-bottom: 4px; }
.tcard p { color: var(--muted); font-size: 15px; margin-bottom: 6px; }
.tc-note { color: var(--ink) !important; background: var(--surface2); padding: 6px 10px; border-radius: 8px; }
.tc-deny { color: var(--danger) !important; font-weight: 500; }
.tc-own { display: flex; align-items: center; gap: 6px; color: var(--ok) !important; font-weight: 600; }
.tc-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 120px; text-align: right; }
.tc-gain { font: 400 24px/1 var(--display); }
.tc-gain small { display: block; font: 600 13px var(--cond); color: var(--muted); margin-top: 3px; }
.tc-meta { display: flex; gap: 8px; font-size: 13px; font-family: var(--cond); color: var(--muted); }
.diff { font-weight: 600; }
.d-просто { color: var(--ok); } .d-средне { color: var(--warn); } .d-сложно { color: var(--danger); }
.project { margin-top: 32px; padding: 18px; background: var(--surface); border: 2px solid var(--ink); border-radius: 18px; }
.project h2 { margin-top: 0; }
.proj-hp { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.proj-hp .was { font: 400 30px var(--display); color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.proj-hp .arrow { font: 400 30px var(--display); color: var(--muted); }
.proj-hp .now { font: 400 46px/1 var(--display); background: var(--plate); color: var(--plate-ink); padding: 4px 12px; border-radius: 10px; }
.proj-hp .u { font-weight: 600; }
.total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 0; font-size: 17px; border-top: 2px solid var(--ink); margin-top: 8px; }
.total b { font: 400 22px var(--display); }
.warns { margin: 8px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.warns li { padding: 8px 12px; border-left: 4px solid var(--warn); background: var(--surface2); border-radius: 4px; font-size: 15px; }

/* ---------- запчасти и смета ---------- */
.parts { list-style: none; padding: 0; margin: 8px 0 0; border-top: 1px solid var(--line); }
.parts li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.parts li.no { opacity: .55; }
.parts li > div { display: flex; flex-direction: column; min-width: 0; }
.pc { font-size: 12px; color: var(--muted); }
.pnote { font-size: 13px; color: var(--danger); }
.pmine { font-size: 13px; color: var(--ok); font-weight: 600; }
.cartbar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 16px; padding: 12px 14px; background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; }
.cartbar span { flex: 1 1 160px; }
@media (min-width: 980px) { .cartbar { bottom: 16px; } }
.est { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.est-row { display: grid; grid-template-columns: 1fr 110px; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; position: relative; padding-right: 56px; }
.est-row .icon-btn { position: absolute; top: 12px; right: 10px; }
@media (min-width: 760px) { .est-row { grid-template-columns: 1.4fr 100px 1.4fr 100px; } }
.saved { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
.saved li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.saved li > div { display: flex; flex-direction: column; min-width: 0; }

/* ---------- листы ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(15,17,19,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 720px; max-height: 92%; display: flex; flex-direction: column; border-radius: 20px 20px 0 0; padding: 16px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .overlay { align-items: center; } .sheet { border-radius: 20px; max-height: 86%; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.sheet-head h2 { margin: 0; }
.sheet-body { overflow-y: auto; margin-top: 4px; }
.more-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.more-item { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; text-align: left; }
.more-item.on { border-color: var(--ink); box-shadow: inset 4px 0 0 var(--plate); }
.brand-group h3 { font: 400 18px var(--display); margin: 18px 0 6px; color: var(--mud); }
.brand-group.mine { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px 8px; margin-top: 8px; }
.brand-group.mine h3 { color: var(--ink); }
.pick { display: grid; grid-template-columns: minmax(130px, 1fr) 2fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pick.on .pick-name b { box-shadow: inset 0 -6px 0 var(--plate); }
.pick-name { display: flex; flex-direction: column; }
.pick-vers { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.pick-v { display: flex; flex-direction: column; align-items: flex-start; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; }
.pick-v:hover { border-color: var(--ink); background: var(--plate); color: var(--plate-ink); }
.pick-v span { font-family: var(--cond); font-weight: 700; }
.pick-v small { font-size: 12px; opacity: .8; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 500; max-width: 90vw; }
@media (min-width: 980px) { .toast { bottom: 24px; } }

@media (max-width: 560px) {
  .tcard { grid-template-columns: 1fr; }
  .tc-side { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; text-align: left; }
  .issues li { grid-template-columns: 1fr; gap: 2px; }
  .pick { grid-template-columns: 1fr; }
  .pick-vers { justify-content: flex-start; }
  .saved li { grid-template-columns: 1fr auto; }
  .qresults button { grid-template-columns: 1fr auto; }
  .qr-type { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

/* ===================== v4 ===================== */
body { background: radial-gradient(1200px 500px at 70% -10%, rgba(243,195,24,.08), transparent 60%), var(--bg); }
.top-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn.dark { background: var(--stage2); border-color: #3B434B; color: var(--stage-ink); }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--plate); color: var(--plate-ink); font: 700 11px var(--cond); margin-left: auto; }
.tab-ico { position: relative; }
.tab-ico .badge { position: absolute; top: -6px; right: -10px; }
.rail-item .badge { margin-left: auto; }
.tabbar { grid-template-columns: repeat(5, 1fr); }

/* сцена v4 */
.stage-top { display: grid; grid-template-columns: 1fr auto; align-items: center; }
.stage-id { min-width: 0; }
.stage-chipsline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.stage-chipsline span { font: 600 12px var(--cond); color: var(--stage-ink); background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); padding: 3px 9px; border-radius: 999px; }
.tacho { width: 132px; height: auto; flex: none; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }

@keyframes jitter { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
.tacho-n { font: 600 8px var(--cond); fill: rgba(255,255,255,.65); }
.tacho-v { font: 400 14px var(--display); fill: var(--plate); }
.tacho-u { font: 500 7px var(--cond); fill: rgba(255,255,255,.5); }
@media (max-width: 600px) { .tacho { width: 84px; } .stage-top { align-items: start; } }

.stage-ctrl { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 18px 12px; }
.start-btn { display: inline-flex; align-items: center; gap: 10px; padding: 6px 18px 6px 6px; border-radius: 999px; border: 0; background: var(--plate); color: var(--plate-ink); font: 400 17px var(--display); box-shadow: 0 6px 18px -6px rgba(243,195,24,.7), inset 0 -3px 0 rgba(0,0,0,.18); }
.start-btn .sb-ring { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--plate-ink); color: var(--plate); }
.start-btn.on { background: #E5533D; color: #fff; box-shadow: 0 6px 18px -6px rgba(229,83,61,.8), inset 0 -3px 0 rgba(0,0,0,.2); }
.start-btn.on .sb-ring { background: #fff; color: #E5533D; }
.start-btn:active { transform: scale(.97); }
.ctl { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid #434B53; background: rgba(255,255,255,.05); color: var(--stage-ink); font-size: 14px; font-weight: 500; }
.ctl.on { border-color: var(--plate); color: var(--plate); background: rgba(243,195,24,.1); }
.seg.dark { background: rgba(255,255,255,.05); border-color: #434B53; }
.seg.dark button { color: var(--stage-ink); border-color: #434B53; padding: 7px 12px; font-size: 14px; }
.seg.dark button.on { color: var(--plate-ink); }
.stage-note { position: relative; z-index: 1; margin: 0; padding: 0 18px 16px; font-size: 13px; color: var(--stage-muted); }
.explorer.compact .engine-svg { max-width: 680px; }

/* анимации мотора */
.engine-svg.running .body { animation: shake var(--shake, .1s) linear infinite; transform-origin: 300px 330px; }
@keyframes shake { 0% { transform: translate(0,0); } 25% { transform: translate(.7px,-.5px); } 50% { transform: translate(-.5px,.6px); } 75% { transform: translate(.4px,.3px); } 100% { transform: translate(0,0); } }
.puff { transform-box: fill-box; transform-origin: center; animation: puff var(--puff, 1.2s) ease-out infinite; opacity: 0; }
@keyframes puff { 0% { opacity: .9; transform: translate(0,0) scale(.4); } 100% { opacity: 0; transform: translate(46px,-22px) scale(2.4); } }
.heat { opacity: 0; transition: opacity 6s ease; }
.engine-svg.running .heat { opacity: .55; }
.chain-run { animation: chain .35s linear infinite; }
@keyframes chain { to { stroke-dashoffset: -8; } }
.spin { transform-box: fill-box; transform-origin: center; animation: spin .4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pa.ghost { opacity: .22; }
.engine-svg.xray .lines { opacity: .35; }
.ph { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.15); }
.ph.on { fill: #F3C318; stroke: #F3C318; }
.ph-t { font: 600 11px var(--cond); fill: rgba(255,255,255,.7); }
.ph-t.on { fill: #1B1F22; }
.stage.is-running::after { animation: stripes 1s linear infinite; background-size: 39.6px 6px; }
@keyframes stripes { to { background-position: 39.6px 0; } }

/* главная v4 */
.home-title { max-width: 22ch; font-size: clamp(26px, 4vw, 38px); }
.actions4 { display: grid; gap: 10px; margin: 18px 0; grid-template-columns: 1fr 1fr; }
@media (min-width: 900px) { .actions4 { grid-template-columns: repeat(4, 1fr); } }
.actions4 .act { grid-template-columns: 1fr; gap: 6px; align-items: start; }
.actions4 .act .ico { grid-row: auto; }
.act-main { background: var(--stage); color: var(--stage-ink); border-color: var(--stage); }
.act-main span { color: var(--stage-muted); }
.act-main .ico { color: var(--plate); }
.home-grid { grid-template-columns: 1fr; }
@media (min-width: 760px) { .home-grid { grid-template-columns: 1fr 1fr; } }
.guide-mini { list-style: none; margin: 0; padding: 0; }
.guide-mini button { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 9px 2px; border: 0; border-bottom: 1px dashed var(--line); background: none; }
.guide-mini small { font: 600 12px var(--cond); }
.preride .ring { width: 46px; height: 46px; }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 4; }
.ring-fg { fill: none; stroke: var(--ok); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 18px 18px; transition: stroke-dasharray .3s; }
.ring text { font: 700 9px var(--cond); fill: var(--ink); }
.checklist { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 2px; }
.checklist button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 4px; border: 0; background: none; font-size: 15px; border-radius: 8px; }
.checklist button:hover { background: var(--surface2); }
.checklist .cb { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; }
.checklist button.on { color: var(--muted); text-decoration: line-through; }
.checklist button.on .cb { background: var(--ok); border-color: var(--ok); color: #fff; }
.ok-msg { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(47,122,77,.12); color: var(--ok); font-weight: 600; }

/* умная диагностика */
.sym-groups { display: grid; gap: 4px 18px; margin-top: 8px; }
@media (min-width: 820px) { .sym-groups { grid-template-columns: 1fr 1fr; } }
.sym-group h3 { margin: 12px 0 0; font: 600 13px var(--cond); color: var(--mud); text-transform: none; }
.sym-group .tags { margin: 6px 0; gap: 6px; }
.symchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; text-align: left; }
.symchip:hover { border-color: var(--ink); }
.symchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cond-box { margin-top: 16px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px dashed var(--mud); }
.cond-box h3 { margin: 0; }
.results { margin-top: 20px; }
.results-head { display: flex; justify-content: space-between; align-items: baseline; }
.results-head h2 { margin: 0 0 10px; }
.cause { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 8px; overflow: hidden; }
.cause.open { border-color: var(--ink); }
.cause-head { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; }
.cause-rank { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); font: 400 14px var(--display); }
.cause:first-of-type .cause-rank { background: var(--plate); color: var(--plate-ink); }
.cause-title { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.sev-tag { font: 600 11px var(--cond); color: #fff; background: var(--danger); padding: 2px 8px; border-radius: 999px; }
.cause-pct { display: flex; align-items: center; gap: 8px; font: 600 14px var(--cond); min-width: 110px; justify-content: flex-end; }
.pbar { width: 70px; height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--mud); border-radius: 4px; }
.cause:first-of-type .pbar span { background: var(--plate); }
.cause-body { padding: 0 16px 14px 56px; }
@media (max-width: 600px) { .cause-body { padding-left: 16px; } .cause-pct { min-width: 0; } .pbar { width: 44px; } }
.cause-body ol { margin: 4px 0 8px; padding-left: 20px; }
.why { font-size: 14px; color: var(--muted); }
.cost { font-size: 15px; }
.trees { margin-top: 26px; }
.trees summary { cursor: pointer; font-weight: 600; padding: 10px 0; }

/* инструкции */
.g-meta.big { font-size: 15px; }
.g-progress { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; margin: 10px 0 0; max-width: 760px; }
.g-progress span { display: block; height: 100%; background: var(--plate); transition: width .3s; }

/* тюнинг v4 */
.tune-builder { margin: 8px 0 18px; }
.tune-builder h2 { margin-top: 0; }
.budget { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; max-width: 520px; font-size: 15px; }
.budget input[type="range"] { width: 100%; accent-color: var(--mud); min-height: 30px; }
.plan { list-style: none; margin: 6px 0 0; padding: 0; }
.plan li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.plan li > div { display: flex; flex-direction: column; }
.project .panel-head h2 { margin: 0; }
.proj-hp .now-plain { font: 400 40px/1 var(--display); }
.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin: 10px 0 16px; }
@media (min-width: 760px) { .meters { grid-template-columns: repeat(4, 1fr); } }
.meter-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.meter-top b { font: 400 16px var(--display); color: var(--ink); }
.meter-top small { font: 600 12px var(--cond); margin-left: 4px; }
.up { color: var(--ok); } .down { color: var(--danger); }
.meter-bar { position: relative; height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; margin-top: 4px; }
.meter-bar span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width .4s; }
.meter-bar .was { background: rgba(122,92,62,.35); }
.meter-bar .now { background: var(--plate); mix-blend-mode: multiply; }
:root[data-theme="dark"] .meter-bar .now { mix-blend-mode: normal; opacity: .85; }
.dyno { margin: 6px 0 12px; }
.dyno svg { width: 100%; height: auto; background: var(--stage); border-radius: 14px; }
.dg { stroke: rgba(255,255,255,.07); }
.dt { font: 500 11px var(--cond); fill: rgba(255,255,255,.55); }
.dl-stock { fill: none; stroke: #9AA3AA; stroke-width: 2.5; stroke-dasharray: 6 5; }
.dl-tuned { fill: none; stroke: #F3C318; stroke-width: 3.5; filter: drop-shadow(0 0 6px rgba(243,195,24,.5)); }
.dyno figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; margin-top: 6px; }
.lg { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-left: 8px; }
.lg-stock { background: #9AA3AA; margin-left: 0; } .lg-tuned { background: #F3C318; }
.sprockets { margin: 18px 0; }
.sprockets h2 { margin-top: 0; }
.spr-grid { display: grid; gap: 12px; }
@media (min-width: 640px) { .spr-grid { grid-template-columns: 1fr 1fr; } }
.fgrid.two { grid-template-columns: 1fr 1fr; }
.spr-res { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
@media (min-width: 640px) { .spr-res { grid-template-columns: repeat(4, 1fr); } }
.spr-res div { background: var(--surface2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; }
.spr-res span { font-size: 12px; color: var(--muted); }
.spr-res b { font: 400 19px var(--display); }
.list-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 28px; }
.list-head h2 { margin: 0; }

/* журнал */
.log { list-style: none; padding: 0; margin: 0; max-width: 640px; }
.log li { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.log-d { font: 600 13px var(--cond); color: var(--mud); }

.plan li.in b { color: var(--ok); }
.btn:disabled { opacity: .55; cursor: default; }

.boot { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font: 16px/1.5 var(--body); }
.boot b { display: block; font: 400 26px var(--display); color: var(--ink); margin-bottom: 6px; }

  if (e.groups.indexOf("liquid") >= 0) return 1.35;

function fits(item, eng) {
  if (!item.fit || !eng) return true;
  return item.fit.some(function (f) { return f === eng.id || eng.groups.indexOf(f) >= 0; });
}
function partByKind(kind, eng) {
  var c = PARTS.filter(function (p) { return p.kind === kind && fits(p, eng); });
  return c[0] || null;
}
function partByName(name) { return PARTS.find(function (p) { return p.name === name; }) || null; }
function partById(id) { return PARTS.find(function (p) { return p.id === id; }) || null; }

function tuningFor(t, eng) {
  var deny = null;
  if (t.deny) Object.keys(t.deny).forEach(function (k) { if (k === eng.id || eng.groups.indexOf(k) >= 0) deny = t.deny[k]; });
  var ok = fits(t, eng) && !deny;
  var note = null;
  if (t.notes) Object.keys(t.notes).forEach(function (k) { if (k === eng.id || eng.groups.indexOf(k) >= 0) note = t.notes[k]; });
  if (!fits(t, eng) && !deny) deny = "Не подходит для этого мотора.";
  return { ok: ok, deny: deny, note: note };
}

/* Разумный диаметр диффузора для мотора, мм */
function carbRange(e) {
  if (e.groups.indexOf("efi") >= 0) return null;
  if (e.groups.indexOf("2t") >= 0) return [34, 38];
  if (e.cc <= 60) return [16, 19];
  if (e.cc <= 130) return [19, 24];
  if (e.cc <= 170) return [24, 28];
  if (e.cc <= 235) return [26, 30];
  if (e.cc >= 400) return [36, 40];
  if (e.groups.indexOf("dohc") >= 0) return [32, 36];
  if (e.cc > 260 || e.groups.indexOf("zs4v") >= 0) return [30, 34];
  return [27, 32];
}

  const out = [];
  CAUSES.forEach(c => {
    if (!okFor(c, eng)) return;
    let s = 0;
    const why = [];
    symSel.forEach(id => {
      if (c.w[id]) {
        s += c.w[id];
        const it = [].concat.apply([], SYMPTOMS.map(x => x.items)).find(i => i[0] === id);

        s += c.cond[id];
        why.push((CONDITIONS.find(x => x[0] === id) || [0, ""])[1].toLowerCase());
      }
    });
    if (c.k && eng.issues.some(i => c.k.test(i.t))) {
      s += 1.5;
      why.push("известное слабое место " + eng.code);
    }
    if (c.id === "valvetight" && due("valves")) {
      s += 3;
      why.push("по ТО пора регулировать клапаны");
    }
    if (c.id === "lowoil" && due("oil")) {
      s += 3;
      why.push("по ТО пора менять масло");
    }
    if (c.id === "camchain" && due("camchain")) {
      s += 2;
      why.push("по ТО пора осмотреть цепь ГРМ");
    }
    if (c.id === "airfilter" && due("air")) {
      s += 2;
      why.push("фильтр давно не обслуживали");
    }
    if (c.id === "piston2t" && due("piston")) {
      s += 3;
      why.push("по моточасам пора менять поршень");
    }
    if (c.id === "plug" && due("spark")) {
      s += 2;
      why.push("свеча старая по пробегу");
    }
    if (c.id === "lean" && flowMods.length && inst.indexOf("jets") < 0) {
      s += 3;
      why.push("стоит " + TUNING.find(t => t.id === flowMods[0]).title.toLowerCase() + " без перенастройки смеси");
    }
    if ((c.id === "lean" || c.id === "rich") && eng.jetsFromPreset) {
      s += 1;
      why.push("карбюратор меняли, жиклёры не уточнены");
    }
    if (c.id === "needcool" && flowMods.length && inst.indexOf("oilcool") < 0) {
      s += 2;
      why.push("мотор доработан, а маслорадиатора нет");
    }
    if (c.id === "advance" && (inst.indexOf("cdi") >= 0 || inst.indexOf("cdi-prog") >= 0)) {
      s += 2;
      why.push("стоит спортивный CDI");
    }
    out.push({
      c: c,
      s: s,
      why: why
    });
  });
  out.sort((a, b) => b.s - a.s);
  const top = out.slice(0, 6),
    sum = top.reduce((a, x) => a + x.s, 0);
  top.forEach(x => {
    x.pct = Math.max(4, Math.round(x.s / sum * 100));
  });
  return top;
}
