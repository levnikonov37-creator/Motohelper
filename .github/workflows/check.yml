name: Проверка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # ubuntu-latest стал 26.04 — Playwright 1.56 на нём браузер не ставит; закреплено до обновления Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Проверка базы
        run: npm run test:data
      - run: npx playwright install --with-deps chromium
      - name: Проверка страницы в браузере
        run: npm run test:page
