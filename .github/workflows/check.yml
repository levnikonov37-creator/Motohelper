name: Проверка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Проверка базы
        run: npm run test:data
      - run: npx playwright install --with-deps chromium
      - name: Проверка страницы в браузере
        run: npm run test:page
