# Выкладка ИИ-сервера (worker/) в Cloudflare (worker/deploy.sh) после каждого изменения в main: код и расписания запусков.
# Нужен один секрет репозитория — CLOUDFLARE_API_TOKEN (GitHub → Settings → Secrets and variables → Actions →
# New repository secret). Токен: dash.cloudflare.com → My Profile → API Tokens → Create Token → шаблон «Edit Cloudflare Workers».
# CLOUDFLARE_ACCOUNT_ID задавать не обязательно — deploy.sh найдёт аккаунт сам.
# Без токена шаг пропускается (проверка не краснеет), а в итогах запуска появляется предупреждение.
# Выложить вручную: Actions → deploy-worker → Run workflow.
name: deploy-worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: sh worker/deploy.sh
      - name: No token
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::CLOUDFLARE_API_TOKEN не задан в секретах репозитория — ИИ-сервер не выложен"
