# Настройки ИИ-сервера для автодеплоя (Cloudflare → motohelper-ai → Settings → Build → Connect: репозиторий
# Motohelper, Root directory: worker). После каждого мержа в main Cloudflare сам выкладывает motohelper-ai.js.
# Секреты (DEEPSEEK_API_KEY, GEMINI_API_KEY, FEEDBACK_TOKEN…) задаются в Cloudflare и при деплое не стираются.
name = "motohelper-ai"
main = "motohelper-ai.js"
compatibility_date = "2026-10-08"
workers_dev = true
# не стирать переменные, заданные в Cloudflare руками (DAILY_TOTAL, DAILY_PER_USER)
keep_vars = true

# встроенный ИИ Cloudflare (запасной, бесплатный)
[ai]
binding = "AI"

# сообщения «Нашёл неточность» и счётчик лимитов
[[kv_namespaces]]
binding = "FEEDBACK"
id = "158eaf5afe82443b80c2ae3b721b57de"

# Telegram-канал: раз в день в 15:00 UTC (18:00 МСК) — очередной пост из tg/posts.json;
# по понедельникам в 06:00 UTC (09:00 МСК) — отчёт о посещаемости владельцу
[triggers]
crons = ["0 15 * * *", "0 6 * * 1"]

# партнёрка AliExpress (Admitad): стандартная ссылка программы — запасной вариант для /go, пока нет ключей API
[vars]
# площадка Motohelper и программа «AliExpress RU&CIS» в Admitad (не секрет; ключи API — секреты в Cloudflare)
ADMITAD_W_ID = "3016101"
ADMITAD_C_ID = "25179"
ADMITAD_ALI_DEFAULT = "https://ali.click/9d7cp17?gc=vv3q4oey1vb0f020d6f6b6d1781017&erid=2bL9aMPo2e49hMef4pdzo6JkYp"
