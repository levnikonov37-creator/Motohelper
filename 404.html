<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Страница не найдена — MotoHelper</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600&family=Fira+Sans:wght@400;500&family=Russo+One&display=swap" />
<link rel="stylesheet" href="/m/m.css" />
<style>.nf{min-height:70vh;display:grid;place-content:center;text-align:center;gap:6px}.nf .big{font:400 clamp(72px,22vw,140px)/1 var(--display);font-style:italic;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:none}.nf .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}.nf .btn{padding:12px 18px;border-radius:3px;text-decoration:none;font:600 15px var(--cond);color:#000;background:#fff;box-shadow:4px 4px 0 rgba(255,255,255,.22)}.nf .btn.g{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;box-shadow:none}</style>
</head>
<body>
<header class="top"><a class="logo" href="/"><i>MH</i>MotoHelper</a></header>
<main class="nf">
  <div class="big">404</div>
  <h1>Тут пусто</h1>
  <p class="lead">Такой страницы нет — возможно, ссылка устарела. Мотоцикл можно найти в каталоге или прямо в приложении.</p>
  <div class="row"><a class="btn" href="/">Открыть MotoHelper</a><a class="btn g" href="/m/">Каталог моделей</a></div>
</main>
<script>/* старые ссылки вида /?bike=… или /#… — отправляем в приложение */ if (/[?#]bike=/.test(location.href)) location.replace("/" + location.search + location.hash);</script>
</body>
</html>
